name: sdui_app
description: "Host app for the SDUI Stac client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  sdui_client:
    path: ../../SDUI

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/screens/
